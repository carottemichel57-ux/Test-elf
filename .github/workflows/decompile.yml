      - name: Décompiler
        env:
          ADDRS: ${{ inputs.addrs }}
        run: |
          mkdir -p proj
          ghidra_*/support/analyzeHeadless proj p -import seg0.bin \
            -loader BinaryLoader -loader-baseAddr 0x81000000 \
            -processor ARM:LE:32:v7 -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE" \
            -postScript Decomp.java "$GITHUB_WORKSPACE/out.c" $ADDRS
          head -n 300 out.c
